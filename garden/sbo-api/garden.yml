kind: Module
type: container
name: sbo-api
image: tgs-api
services:
  - name: sbo-api
    dependencies:
      - postgres
      - redis
      - nats
    env:
      GameProviderCode: "SBO"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      Game__CashBaseUrl: "http://cash-service"
      FeatureManagement__SBO: true
      TCGFtpApi__Url: "http://tcg-ftp:49153"
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 sbo-api.localhost` to host file
      - hostname: sbo-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3004
