kind: Module
type: container
name: brand-api
image: pgtgs/brand-api:202208170200-prod # brand-api
services:
  - name: brand-api
    dependencies:
      - postgres
      - redis
      - nats
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      Brand__BrandCertificateBaseUrl: "http://brand-cert-api"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3030 # http://localhost:3030/swagger/index.html
