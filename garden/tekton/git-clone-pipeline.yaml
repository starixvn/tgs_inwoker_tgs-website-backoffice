apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: clone-build-push
spec:
  params:
    - name: repo-url
      type: string
    - name: image-reference
      type: string
    - name: base-version
      type: string
  workspaces:
    - name: shared-data
    - name: git-credentials
    - name: docker-credentials
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: url
          value: $(params.repo-url)
        # https://github.com/tektoncd/catalog/issues/1052 wait for fix
        - name: userHome
          value: "/home/nonroot"
    - name: get-build-id
      runAfter: ["fetch-source"]
      taskRef:
        name: generate-build-id
      params:
        - name: base-version
          value: $(params.base-version)
    - name: build-push
      runAfter: ["get-build-id"]
      taskRef:
        name: kaniko
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: $(params.image-reference):$(tasks.get-build-id.results.build-id)
