kind: Module
type: exec
name: tekton
tasks:
  - name: init-tekton-pipeline
    command:
      - kubectl apply -f https://storage.googleapis.com/tekton-releases/pipeline/previous/v0.39.0/release.yaml
  - name: init-tekton-trigger
    command:
      - kubectl apply -f https://storage.googleapis.com/tekton-releases/triggers/previous/v0.20.2/release.yaml
    dependencies:
      - init-tekton-pipeline
  - name: init-tekton
    command:
      - kubectl apply -f https://storage.googleapis.com/tekton-releases/triggers/previous/v0.20.2/interceptors.yaml
    dependencies:
      - init-tekton-trigger
