kind: Module
type: container
name: mocksite
image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/mocksite:prod-1.2.1
exclude:
  - garden
  - spec
services:
  - name: mocksite
    dependencies:
      - global-api
      - operator-api
    ingresses:
      - hostname: mocksite.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
    volumes:
      - name: data
        containerPath: /data
