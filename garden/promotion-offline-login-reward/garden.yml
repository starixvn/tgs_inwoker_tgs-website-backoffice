kind: Module
type: container
name: promotion-offline-login-reward
image: pgtgs/promotion-offlineloginreward:202303071014.10
services:
  - name: promotion-offline-login-reward
    dependencies:
      - postgres
      - redis
      - nats
      - promotion-api
      - player-api
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      OfflineLoginReward__PromotionBaseUrl: "http://promotion-api"
      OfflineLoginReward__PlayerServiceBaseUrl: "http://player-api"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
