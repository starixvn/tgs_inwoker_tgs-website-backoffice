kind: Module
type: container
name: agent-service
image: pgtgs/agent-service:202312081109.112
# TODO: use bo api to create brand contract
# image: pgtgs/agent-service:202401080845.119
services:
  - name: agent-service
    dependencies:
      - postgres
      - player-api
      - cash-service
      - agent-dividend-service
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      AgentService__PlayerServiceBaseUrl: "http://player-api"
      AgentService__CashBaseUrl: "http://cash-service"
      AgentService__AgentDividendServiceBaseUrl: "http://agent-dividend-service"
    ports:
      - name: http
        containerPort: 80
        # Note. new agent-service:202401080845.119 use 8080 port instead
        # containerPort: 8080
        servicePort: 80
