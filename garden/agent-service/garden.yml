kind: Module
type: container
name: agent-service
image: pgtgs/agent-service:202408010614.163
services:
  - name: agent-service
    dependencies:
      - postgres
      - player-api
      - cash-service
      - agent-dividend-service
      - brand-cert-api
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      AgentService__PlayerServiceBaseUrl: "http://player-api"
      AgentService__CashBaseUrl: "http://cash-service"
      AgentService__AgentDividendServiceBaseUrl: "http://agent-dividend-service"
      AgentService__BrandCertificateUrl: "http://brand-cert-api"
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
