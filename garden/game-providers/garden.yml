kind: Module
type: container
name: game-providers
image: harbor.rpgp.cc/tgs/game-gameproviders:202206300652-dev # game/gameproviders
services:
  - name: game-providers
    dependencies:
      - postgres
      - redis
      - nats
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__NatsMQ: "nats://nats:4222"
      GameProviders__GameProvidersQueryServerBaseUrl: "http://game-provider-query-server"
      GameProviders__GameRoundsServiceBaseUrl: "http://game-rounds"
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 game-providers.localhost` to host file
      - hostname: game-providers.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
