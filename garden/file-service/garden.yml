kind: Module
type: container
name: file-service
image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/file-service:prod-2021901-0833
services:
  - name: file-service
    dependencies:
      - mongodb
      - nats
      - localstack
      - init-public-bucket
      - init-private-bucket
    env:
      ConnectionStrings__File: "mongodb://root:1qaz2wsx!%40@mongodb/filedb?retryWrites=true&w=majority&authSource=admin"
      ConnectionStrings__Nats: "nats://nats:4222"
      AWS__Public__ExternalServiceUrl: "http://localstack.localhost"
      AWS__Public__ServiceUrl: "http://localstack:4566"
      AWS__Private__ExternalServiceUrl: "http://localstack.localhost"
      AWS__Private__ServiceUrl: "http://localstack:4566"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
