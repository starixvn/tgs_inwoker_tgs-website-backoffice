kind: Module
type: container
name: game-pluggable-service
image: harbor.rpgp.cc/tgs/game-pluggable-service:202207050546-dev # game/gamepluggableservice
services:
  - name: game-pluggable-service
    dependencies:
      - postgres
      - nats
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__NatsMQ: "nats://nats:4222"
      Pluggable__GameProvidersBaseUrl: "http://game-providers"
      Pluggable__CashServiceBaseUrl: "http://cash-service"
      Pluggable__GameProviderKickPlayerServerBaseUrl: "http://game-kickplayer-server"
      Pluggable__GameProvidersQueryServerBaseUrl: "http://game-provider-query-server"
      Pluggable__GameVerificationBaseUrl: "http://game-verification"
      Pluggable__GameFundTransferBaseUrl: ""
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 game-pluggable.localhost` to host file
      - hostname: game-pluggable.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
