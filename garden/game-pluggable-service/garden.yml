kind: Module
type: container
name: game-pluggable-service
image: pgtgs/game-pluggable-service:202208220628-dev
services:
  - name: game-pluggable-service
    dependencies:
      - postgres
      - game-providers
      - cash-service
      - game-kickplayer-server
      - game-provider-query-server
      - game-verification
      - game-currency
      - game-rounds
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      Pluggable__GameProvidersClientBaseUrl: "http://game-providers"
      Pluggable__CashServiceClientBaseUrl: "http://cash-service"
      Pluggable__KickPlayerServiceClientBaseUrl: "http://game-kickplayer-server"
      Pluggable__GameProvidersQueryServerClientBaseUrl: "http://game-provider-query-server"
      Pluggable__GameVerificationClientBaseUrl: "http://game-verification"
      Pluggable__GameFundTransferClientBaseUrl: "http://game-fund-transfer"
      Pluggable__GameCurrencyClientBaseUrl: "http://game-currency"
      Pluggable__GameRoundsClientBaseUrl: "http://game-rounds"
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 game-pluggable.localhost` to host file
      - hostname: game-pluggable.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
