kind: Module
type: container
name: payment-withdraw-limit
image: pgtgs/payment-withdraw-limit:202309120342.3
services:
  - name: payment-withdraw-limit
    dependencies:
      - redis
      - nats
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
