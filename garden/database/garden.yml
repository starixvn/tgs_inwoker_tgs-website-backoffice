kind: Module
type: exec
name: database
repositoryUrl: git@gitlab.com:rayprosoft/tgs-database.git#main
tasks:
  - name: init-seeding
    dependencies:
      - postgres
      - init-migration
    command: [dotnet, run, --project, ./TgsSeeding, -f, net8.0]
  - name: init-migration
    dependencies:
      - init-dotnet-ef
      - postgres
    command:
      - dotnet ef database update -s ./MigrationEntry
  - name: init-dotnet-ef
    command:
      - dotnet tool restore
