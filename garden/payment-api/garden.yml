kind: Module
type: container
name: payment-api
image: pgtgs/payment-api:202309150208.324
services:
  - name: payment-api
    dependencies:
      - postgres
      - redis
      - nats
      - player-api
      - cash-service
      - player-bucket-api
      - viplevel-api
      - brand-cert-api
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      Payment__PlayerServiceBaseUrl: "http://player-api"
      Payment__CashServiceBaseUrl: "http://cash-service"
      Payment__PlayerBucketServiceBaseUrl: "http://player-bucket-api"
      Payment__VipLevelServiceBaseUrl: "http://viplevel-api"
      Payment__BrandCertificateBaseUrl: "http://brand-cert-api"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3080 # http://localhost:3080/swagger/index.html
