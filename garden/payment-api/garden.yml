kind: Module
type: container
name: payment-api
image: harbor.rpgp.cc/tgs/payment-api:202205270302-staging # payment/service #registry.gitlab.com/rayprosoft/turnkey-gaming-system/payment-api:202111050510-staging
services:
  - name: payment-api
    dependencies:
      - postgres
      - nats
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
