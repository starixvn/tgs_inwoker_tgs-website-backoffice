kind: Module
type: container
name: game-verification
image: pgtgs/game-gameverification:202210110826-prod
disabled: true
services:
  - name: game-verification
    dependencies:
      - nats
    env:
      ConnectionStrings__Nats: "nats://nats:4222"
      GameVerification__GameVerificationWorkBaseUrl: "http://game-verification-worker"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
