kind: Module
type: container
name: operator-api
image: pgtgs/operator-api:202401110139.366
services:
  - name: operator-api
    dependencies:
      - postgres
      - redis
      - nats
      - file-service
      - promotion-api
      - station-letter
      - player-bucket-api
      - viplevel-api
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      Operator__FileServiceBaseUrl: "http://file-service"
      Operator__PaymentServiceBaseUrl: "http://payment-api"
      Operator__BrandCertificateBaseUrl: "http://brand-cert-api"
      Operator__CashBaseUrl: "http://cash-service"
      Operator__PlayerServiceBaseUrl: "http://player-api"
      Operator__StationLetterBaseUrl: "http://station-letter"
      Operator__PlayerBucketBaseUrl: "http://player-bucket-api"
      Operator__VipLevelServiceBaseUrl: "http://viplevel-api"
      Promotion__Url: "http://promotion-api"
      ForwardedHeaders__ForwardedForHeaderName: "X-Forwarded-For"
    ingresses:
      - hostname: mocksite.localhost
        path: /api
        port: http
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 operator-api.localhost` to host file
      - hostname: operator-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3003 # http://localhost:3003/swagger/index.html
