kind: Module
type: container
name: promotion-api
image: promotion-api
services:
  - name: promotion-api
    dependencies:
      - postgres
      - nats
      - file-service
      - rabbitmq
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      Promotion__PaymentServiceBaseUrl: "http://payment-api"
      Promotion__FileServiceBaseUrl: "http://file-service"
      Promotion__CashBaseUrl: "http://cash-service"
      NatsSetting__Urls: "nats://nats:4222"
      RabbitMQ__RabbitMQUrl: "amqp://rabbitmq:5672"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
