kind: Module
type: container
name: promotion-api
image: pgtgs/promotion-api:202408130148.335
services:
  - name: promotion-api
    dependencies:
      - postgres
      - redis
      - nats
      - payment-api
      - cash-service
      - player-api
      - player-bucket-api
      - viplevel-api
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      Promotion__PaymentServiceBaseUrl: "http://payment-api"
      Promotion__CashBaseUrl: "http://cash-service"
      Promotion__PlayerServiceBaseUrl: "http://player-api"
      Promotion__PlayerBucketBaseUrl: "http://player-bucket-api"
      Promotion__VipLevelServiceBaseUrl: "http://viplevel-api"
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        localPort: 3050 # http://localhost:3050/swagger/index.html
