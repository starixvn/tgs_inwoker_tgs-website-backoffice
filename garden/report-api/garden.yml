kind: Module
type: container
name: report-api
image: pgtgs/report-api:202310061023.14
services:
  - name: report-api
    dependencies:
      - postgres
      - redis
      - nats
      - rabbitmq
      - report-aggregate-api
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      Report__GameProvidersPluggableBaseUrl: "http://game-pluggable-service"
      RabbitMQ__RabbitMQUrl: "amqp://rabbitmq:5672"
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 report-api.localhost` to host file
      - hostname: report-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3010
