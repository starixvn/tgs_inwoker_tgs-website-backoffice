kind: Module
type: container
name: report-api
image: pgtgs/report-api:202408210603.129
services:
  - name: report-api
    dependencies:
      - postgres
      - nats
      - player-api
      - brand-cert-api
      # - rabbitmq
      - report-aggregate-api
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Nats: "nats://nats:4222"
      Report__GameProvidersPluggableBaseUrl: "http://game-pluggable-service"
      Report__PlayerServiceBaseUrl: "http://player-api"
      Report__BrandCertificate: "http://brand-cert-api"
      # RabbitMQ__RabbitMQUrl: "amqp://rabbitmq:5672"
    ingresses:
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 report-api.localhost` to host file
      - hostname: report-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        localPort: 3010
