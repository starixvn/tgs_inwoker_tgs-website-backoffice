kind: Module
type: container
name: global-api
image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/global-api:staging
services:
  - name: global-api
    dependencies:
      - postgres
      - redis
      - nats
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
    ingresses:
      - hostname: mocksite.localhost
        path: /global-api
        port: http
      - hostname: global-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
