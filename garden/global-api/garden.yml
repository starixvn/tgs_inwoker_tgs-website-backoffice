kind: Module
type: container
name: global-api
image: global-api
services:
  - name: global-api
    dependencies:
      - postgres
      - redis
      - nats
    env:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      Global__BrandCertificateBaseUrl: "http://brand-cert-api"
    ingresses:
      - hostname: mocksite.localhost
        path: /global-api
        port: http
      # Note. add this hostname to your hosts file for local dev, for instance add `127.0.0.1 global-api.localhost` to host file
      - hostname: global-api.localhost
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
