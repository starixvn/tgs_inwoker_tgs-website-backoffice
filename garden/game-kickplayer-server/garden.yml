kind: Module
type: container
name: game-kickplayer-server
image: pgtgs/game-kickplayer-server:202210120144-staging
disabled: true
services:
  - name: game-kickplayer-server
    dependencies:
      - rabbitmq
    env:
      RabbitMQ__RabbitMQUrl: "amqp://rabbitmq:5672"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
