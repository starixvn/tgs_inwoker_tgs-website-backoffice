kind: Module
type: container
name: game-kickplayer-server
image: game/kickplayerserver #registry.gitlab.com/rayprosoft/turnkey-gaming-system/game-kickplayer-server:202111230604-staging
disabled: true
services:
  - name: game-kickplayer-server
    dependencies:
      - rabbitmq
    env:
      RabbitMQ__RabbitMQUrl: "amqp://rabbitmq:5672"
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
