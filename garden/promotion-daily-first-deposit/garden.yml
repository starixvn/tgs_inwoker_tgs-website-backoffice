kind: Module
type: container
name: promotion-daily-first-deposit
image: pgtgs/promotion-daily-first-deposit-service:202404010819.7
services:
  - name: promotion-daily-first-deposit
    dependencies:
      - postgres
      - redis
      - nats
      - promotion-api
      - payment-api
      - calculate-api
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      DailyFirstDeposit__PromotionServiceBaseUrl: "http://promotion-api"
      DailyFirstDeposit__PaymentServiceBaseUrl: "http://payment-api"
      DailyFirstDeposit__CalculateServiceBaseUrl: "http://calculate-api"
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
