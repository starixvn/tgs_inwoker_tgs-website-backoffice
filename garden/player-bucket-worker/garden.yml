kind: Module
type: container
name: player-bucket-worker
image: pgtgs/bucket-worker:202401101018.229
services:
  - name: player-bucket-worker
    dependencies:
      - postgres
      - mongodb
      - redis
      - nats
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Mongo: "mongodb://root:1qaz2wsx!%40@mongodb/filedb?retryWrites=true&w=majority&authSource=admin"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      ConnectionStrings__Nats: "nats://nats:4222"
      PlayerBucket__ServiceBaseUrl: "http://player-bucket-api"
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        localPort: 3092 # http://localhost:3092/swagger/index.html
