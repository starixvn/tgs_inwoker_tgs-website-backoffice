kind: Module
type: container
name: backoffice-api
image: backoffice-api
services:
  - name: backoffice-api
    dependencies:
      - postgres
      - redis
      - nats
      - operator-api
      - file-service
      - promotion-api
      - report-api
      # - log-api
      - payment-api
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      File__FileServiceBaseUrl: "http://file-service"
      BrandCertificate__Url: "http://brand-cert-api"
      Promotion__Url: "http://promotion-api"
      Report__Url: "http://report-api"
      BackOffice__PaymentServiceBaseUrl: "http://payment-api"
      BackOffice__CashBaseUrl: "http://cash-service"
      BackOffice__GameProvidersPluggableBaseUrl: "http://game-pluggable-service"
      BackOffice__ReportAggregateUrl: "http://report-aggregate-api"
      BackOffice__PlayerServiceBaseUrl: "http://player-api"
    ingresses:
      - hostname: backoffice.localhost
        path: /api
        port: http
      - hostname: dev.backoffice.localhost
        path: /api
        port: http
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
        localPort: 3001
