kind: Module
type: exec
name: backoffice-api-image
repositoryUrl: git@gitlab.com:rayprosoft/turnkey-gaming-system.git#develop
disabled: true
build:
  command:
    [
      docker,
      build,
      -t backoffice-api,
      -f ./src/Apis/BackendOffice/Dockerfile,
      '--secret id=nuget,src="C:\Users\${local.username}\AppData\Roaming\NuGet\NuGet.Config"',
      .
    ]
---
# TODO: why failed?
kind: Module
type: exec
name: backoffice-api-src
disabled: true
repositoryUrl: git@gitlab.com:rayprosoft/tgs-bo-api.git#main
tasks:
  - name: init-admin-user
    dependencies:
      - init-seeding
    command: [cd, ./CreateAdminUser, && , dotnet, run]
---
kind: Module
type: container
name: backoffice-api
image: pgtgs/backoffice-api:202403110906.861
services:
  - name: backoffice-api
    dependencies:
      - postgres
      - redis
      - nats
      - operator-api
      - file-service
      - init-seeding
      - promotion-api
      - report-api
      - payment-api
      - station-letter
      - cash-query
      - agent-service
      - game-wagers
      - player-all-agent-api
      - brand-game-credit
      - notification-contact
      - agent-dividend-service
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      File__FileServiceBaseUrl: "http://file-service"
      BrandCertificate__Url: "http://brand-cert-api"
      Promotion__Url: "http://promotion-api"
      Report__Url: "http://report-api"
      BackOffice__PaymentServiceBaseUrl: "http://payment-api"
      BackOffice__CashBaseUrl: "http://cash-service"
      BackOffice__GameProvidersPluggableBaseUrl: "http://game-pluggable-service"
      BackOffice__ReportAggregateUrl: "http://report-aggregate-api"
      BackOffice__PlayerServiceBaseUrl: "http://player-api"
      BackOffice__MarketingReportBaseUrl: "http://marketing-api"
      BackOffice__VipLevelServiceBaseUrl: "http://viplevel-api"
      BackOffice__PlayerBucketBaseUrl: "http://player-bucket-api"
      BackOffice__StationLetterBaseUrl: "http://station-letter"
      BackOffice__CashQueryBaseUrl: "http://cash-query"
      BackOffice__AgentBaseUrl: "http://agent-service"
      BackOffice__GameWagersServiceBaseUrl: "http://game-wagers"
      BackOffice__PlayerAllAgentBaseUrl: "http://player-all-agent-api"
      BackOffice__BrandGameCreditsBaseUrl: "http://brand-game-credit"
      BackOffice__NotificationContactsBaseUrl: "http://notification-contact"
      BackOffice__AgentDividendBaseUrl: "http://agent-dividend-service"
      OTEL_SERVICE_NAME: "BackOffice-Api(local)"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.default.svc.cluster.local:4317"
      # TODO: NODE_IP required?
      NODE_IP: "otel-collector.observability.svc.cluster.local"
    ingresses:
      - hostname: backoffice.localhost
        path: /api
        port: http
      - hostname: dev.backoffice.localhost
        path: /api
        port: http
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        localPort: 3001
