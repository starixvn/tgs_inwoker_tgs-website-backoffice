kind: Module
type: container
name: brand-game-credit-notification
image: pgtgs/brand-gamecredits-notification:202312180944.9
services:
  - name: brand-game-credit-notification
    dependencies:
      - postgres
      - nats
      - redis
      - brand-game-credit
      - notification-contact
      - notification-email
    env:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__Nats: "nats://nats:4222"
      ConnectionStrings__Redis: "redis,abortConnect=false,connectTimeout=3000"
      BrandGameCreditsSetting__BrandGameCreditsClientBaseUrl: "http://brand-game-credit"
      BrandGameCreditsSetting__NotificationContactsClientBaseUrl: "http://notification-contact"
      BrandGameCreditsSetting__NotificationEmailClientBaseUrl: "http://notification-email"
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
