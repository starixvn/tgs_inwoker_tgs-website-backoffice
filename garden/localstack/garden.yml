kind: Module
type: container
name: localstack
image: localstack/localstack-full
services:
  - name: localstack
    env:
      SERVICES: "s3"
      LS_LOG: "trace"
      DATA_DIR: "/tmp/localstack/data"
    ingresses:
      - hostname: localstack.localhost
        port: localstack
    ports:
      - name: localstack
        containerPort: 4566
        localPort: 4566
        servicePort: 4566
    volumes:
      - name: data
        containerPath: /tmp/localstack
