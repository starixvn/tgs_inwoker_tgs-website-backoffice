# apiVersion: garden.io/v1
kind: Project
name: backoffice-site
environments:
  - name: develop # The name of the environment.
  - name: release
  - name: main
defaultEnvironment: develop
providers:
  - name: local-kubernetes # The name of the provider plugin to use.
    environments: ["develop"]
    setupIngressController: false
    # setupIngressController: "nginx"
    imagePullSecrets:
      # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#create-a-secret-by-providing-credentials-on-the-command-line
      - name: regcred # docker auth
        namespace: default

---
kind: Module
type: container
name: backoffice-site
dockerfile: Dockerfile
disabled: true
exclude:
  - garden
  - spec
services:
  - name: backoffice-site
    dependencies:
      - init-seeding
      - backoffice-api
    env:
      MODE: "production"
      LOGIN_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
      HEADER_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS-w.png"
      THEME_PALETTE_PRIMARY: "#3575dd"
      THEME_PALETTE_PRIMARYTINT: "#ebf3fe"
      # LOGIN_TITLE: "PG"
      # LOGIN_SUB_TITLE: "ADMIN"
      # HEADER_TITLE: "PG ADMIN"
      # HEADER_TITLE_COLOR: "#FFF"
      # MODE: "development"
      # LOGIN_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
      # HEADER_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
    ingresses:
      - hostname: backoffice.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
    volumes:
      - name: data
        containerPath: /data
  # - name: dev-backoffice-site
  #   dependencies:
  #     - backoffice-api
  #   env:
  #     MODE: "development"
  #     THEME_PALETTE_PRIMARY: "#3575dd"
  #     THEME_PALETTE_PRIMARYTINT: "#ebf3fe"
  #     LOGIN_BUTTON_COLOR: "rgb(33, 33, 33)"
  #     LOGIN_BUTTON_BACKGROUND: "rgb(247, 247, 250)"
  #     HEADER_BACKGROUND: "#f7f7fa"
  #     HEADER_BACKGROUND_COLOR: "#212121"
  #     LOGIN_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
  #     HEADER_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
  #   ingresses:
  #     - hostname: dev.backoffice.localhost
  #       path: /
  #       port: http
  #   ports:
  #     - name: http
  #       containerPort: 80
  #   volumes:
  #     - name: data
  #       containerPath: /data
---
kind: Module
type: exec
name: backoffice-site-test
disabled: true
include: [.]
exclude: [src, garden]
tests:
  - name: end-to-end
    dependencies:
      - backoffice-site
    command:
      - npm run test
    artifacts:
      - source: ./report/*
        target: backoffice-site-test-result
    env:
      HOST: http://backoffice.localhost
      SBO_HOST: http://sbo-api.localhost
