kind: Project
name: backoffice-site
environments:
  - name: default # The name of the environment.
providers:
  - name: local-kubernetes # The name of the provider plugin to use.

---
kind: Module
type: container
name: backoffice-site
dockerfile: Dockerfile
exclude:
  - garden
  - spec
services:
  - name: backoffice-site
    dependencies:
      - backoffice-api
    env:
      MODE: "production"
      LOGIN_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS.png"
      HEADER_IMAGE_URL: "//images.srvptt.com/GMS%20Logo/GMS-w.png"
      # LOGIN_TITLE: "PG"
      # LOGIN_SUB_TITLE: "ADMIN"
      # HEADER_TITLE: "PG ADMIN"
      # HEADER_TITLE_COLOR: "#FFF"
      # MODE: "development"
      # LOGIN_TITLE: "PG"
      # LOGIN_SUB_TITLE: "ADMIN"
      # HEADER_TITLE: "PG ADMIN"
      # HEADER_TITLE_COLOR: "#000"
    ingresses:
      - hostname: backoffice.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
    volumes:
      - name: data
        containerPath: /data
