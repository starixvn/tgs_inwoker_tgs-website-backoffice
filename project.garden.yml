kind: Project
name: backoffice-site
environments:
  - name: default # The name of the environment.
providers:
  - name: local-kubernetes # The name of the provider plugin to use.

---
kind: Module
type: container
name: backoffice-site
dockerfile: Dockerfile
services:
  - name: backoffice-site
    ependencies:
      - file-service
    ingresses:
      - hostname: backoffice.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
