kind: Project
name: backoffice-site
environments:
  - name: default # The name of the environment.
providers:
  - name: local-kubernetes # The name of the provider plugin to use.

---
kind: Module
type: container
name: backoffice-site
dockerfile: Dockerfile
exclude:
  - garden
  - spec
services:
  - name: backoffice-site
    dependencies:
      - backoffice-api
    env:
      MODE: "production" #"development" #"production"
      LOGIN_TITLE: "PG"
      LOGIN_TITLE_COLOR: "#000"
      LOGIN_SUB_TITLE: "ADMIN"
      LOGIN_SUB_TITLE_FONT_SIZE: "1.7rem"
      HEADER_TITLE: "PG ADMIN"
      HEADER_TITLE_COLOR: "#FFF"
    ingresses:
      - hostname: backoffice.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
    volumes:
      - name: data
        containerPath: /data
