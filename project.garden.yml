kind: Project
name: backoffice-site
environments:
  - name: default # The name of the environment.
providers:
  - name: local-kubernetes # The name of the provider plugin to use.

---
kind: Module
type: container
name: backoffice-site
dockerfile: Dockerfile
exclude:
  - garden
services:
  - name: backoffice-site
    dependencies:
      - backoffice-api
    env:
      MODE: "development" #"production"
    ingresses:
      - hostname: backoffice.localhost
        path: /
        port: http
    ports:
      - name: http
        containerPort: 80
    volumes:
      - name: data
        containerPath: /data
