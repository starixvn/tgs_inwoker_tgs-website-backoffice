<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Office</title>
    <style>
      /* Box sizing rules */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        text-rendering: optimizeSpeed;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      #root,
      body,
      html {
        height: 100%;
      }

      /* Inherit fonts for inputs and buttons */
      input,
      button,
      textarea,
      select {
        font: inherit;
      }

      .box {
        height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 370px;
        border-radius: 6px;
        padding: 1.5rem;
        box-shadow: 0px 1px 4px 0px rgba(0, 0, 0, 0.15),
          0px 0px 2px 1px rgba(0, 0, 0, 0.02);

        @media screen and (max-width: 576px) {
          width: 95%;
        }
      }

      .header {
        font-weight: 600;
        font-size: 1.25em;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .field {
        margin-bottom: 0.5rem;
      }

      :focus-visible {
        outline: none;
      }

      .input {
        color: #161e2e;
        border: 1px solid #d9d9e1;
        height: 2.75em;
        width: 100%;
        border-radius: 6px;
        padding: 0.4em 0.8em;
      }

      .input:focus {
        border-color: #574feb;
        box-shadow: #eeedfd 0px 0px 0px 3px;
      }

      .submit-button {
        cursor: pointer;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        font-weight: 600;
        min-height: 2.75rem;
        justify-content: center;
        padding: 0 1rem;
        text-decoration: none;
        hyphens: auto;
        transition: box-shadow 0.1s ease-in-out 0s, border 0.1s,
          background-color 0.1s;
        border: 1px solid #d9d9e1;
      }

      .flex {
        display: flex;
      }

      .flex-column {
        flex-direction: column;
      }
    </style>
    {{include "login-env.html"}}
