variables:
  Registry: "pgtgs/"
  Image: "backoffice-site"
  
stages:
  - build
  - push
  - deploy

before_script:
  - docker system prune -a -f
  - export TAG=$(date +%Y-%m%d-%H%M)

docker_build:
  stage: build
  script:
    - docker login --username $docker_user --password $docker_token
    - echo $TAG > tag.txt
    - docker build -t ${Registry}${Image}:${TAG} .
    - docker tag ${Registry}${Image}:${TAG} ${Registry}${Image}:latest
    - docker push ${Registry}${Image}:${TAG}
    - docker push ${Registry}${Image}:latest
  artifacts:
    paths:
      - tag.txt
  only:
    - main
    - release
    - develop

deploy-dev:
  stage: deploy
  script:
    - export KUBECONFIG="$KubeConfig_Raypro_dev"
    - TAG=$(cat tag.txt)
    - kubectl set image deployment/${Image} ${Image}=${Registry}${Image}:${TAG} --record -n dev
  dependencies:
    - docker_build
  only:
    - develop

deploy-staging:
  stage: deploy
  script:
    - export KUBECONFIG="$KubeConfig_Raypro_staging"
    - TAG=$(cat tag.txt)
    - kubectl set image deployment/${Image} ${Image}=${Registry}${Image}:${TAG} --record -n staging
  dependencies:
    - docker_build
  only:
    - release

deploy-prod:
  stage: deploy
  script:
    - export KUBECONFIG="$KubeConfig_Raypro_prod"
    - TAG=$(cat tag.txt)
    - kubectl set image deployment/${Image} ${Image}=${Registry}${Image}:${TAG} --record -n prod
  dependencies:
    - docker_build
  when: manual
  only:
    - main