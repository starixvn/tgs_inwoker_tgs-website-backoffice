version: "3.8"

services:
  reverse-proxy:
    image: traefik:v2.4
    command: --api.insecure=true --providers.docker
    ports:
      # The HTTP port
      - 80:80
      # The Web UI http://localhost:9090/dashboard#/ (enabled by --api.insecure=true)
      - 9090:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      tgs:

  backoffice-site:
    build: .
    image: backoffice-site
    container_name: backoffice-site
    environment:
      #MODE: "production"
      #LOGIN_BUTTON_COLOR: "#ffffff"
      #LOGIN_BUTTON_BACKGROUND: "#1e417b"
      #HEADER_BACKGROUND: "#1e417b"
      #HEADER_BUTTON_COLOR: "#ffffff"
      #HEADER_BUTTON_BACKGROUND: "transparent"
      MODE: "development"
      LOGIN_BUTTON_COLOR: "#212121"
      LOGIN_BUTTON_BACKGROUND: "#f7f7fa"
      HEADER_BACKGROUND: "#f7f7fa"
      HEADER_BUTTON_COLOR: "#212121"
      HEADER_BUTTON_BACKGROUND: "transparent"
      PromotionLocalization: "true"
    labels:
      - traefik.http.routers.backoffice-site.rule=Host(`backoffice.localhost`)
    networks:
      tgs:
    depends_on:
      - backoffice-api

  backoffice-api:
    image: backoffice-api
    container_name: backoffice-api
    labels:
      - traefik.http.routers.backoffice-api.rule=Host(`backoffice.localhost`) && (PathPrefix(`/api`))
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      File__FileServiceBaseUrl: "http://fileservice"
      Promotion__Url: "http://promotion-api"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32667:80
    networks:
      tgs:
    depends_on:
      - fileservice
      - promotion-api
      - report-api
      - log-api

  fileservice:
    image: fileservice
    container_name: fileservice
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    networks:
      tgs:
    depends_on:
      - mongodb

  mongodb:
    image: mongo:4.2.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "1qaz2wsx!@"
    volumes:
      - ./.docker/mongodb/db:/data/db
      - ./.docker/mongodb/config:/etc/mongod.conf
      - ./.docker/mongodb/log:/var/log/mongodb/
    networks:
      tgs:
    ports:
      - 27017:27017

  promotion-api:
    image: promotion-api
    container_name: promotion-api
    environment:
      ConnectionStrings__Tgs: "Server=postgres;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      ConnectionStrings__RedisConfigurationString: "redis,abortConnect=false,connectTimeout=3000"
      NatsSetting__Urls: "nats://nats:4222"
      File__FileServiceBaseUrl: "http://fileservice"
    ports:
      - 5201:80
    networks:
      tgs:
    depends_on:
      - postgres

  operator-api:
    image: operator-api
    container_name: operator-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      Operator__FileServiceBaseUrl: "http://fileservice"
      Promotion__Url: "http://promotion-api"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32670:80
    networks:
      tgs:
    depends_on:
      - postgres
      - redis

  report-api:
    image: report-api
    container_name: report-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
      - 5051:80
    networks:
      tgs:
    depends_on:
      - postgres

  log-api:
    image: log-api
    container_name: log-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32668:80
    networks:
      tgs:
    depends_on:
      - postgres
      - nats
      - redis

  nats:
    image: nats
    container_name: nats
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    expose:
      - "4222"
    ports:
      - "8222:8222"
      - 4222:4222
    networks:
      tgs:

  redis:
    image: "redis:alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      tgs:

  postgres:
    image: postgres:13.2-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: "tgs"
      POSTGRES_PASSWORD: "1qaz2wsx!@"
      PGDATA: /data/postgres
    volumes:
      - ./.docker/postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - tgs

networks:
  tgs:
    driver: bridge
